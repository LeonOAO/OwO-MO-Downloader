<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OwO MO Downloader</title><link rel="stylesheet" href="app.css"></head><body><main><nav><b>▶ OwO MO Downloader</b><span>更新日期 · 2026-09-10</span></nav><header><em>簡單、乾淨、在瀏覽器完成</em><h1>YouTube 影音下載工具</h1><p>貼上 YouTube 網址，解析後選擇影片 MP4 或音訊來源。</p></header><section><h2>① 貼上影片網址</h2><div class="url"><input id="youtubeUrl" placeholder="貼上 YouTube 網址…"><button id="analyze">解析影片</button></div><details><summary>進階設定</summary><label>Cloudflare Worker 網址</label><input id="worker" placeholder="https://your-worker.workers.dev"></details></section><div id="status" class="status">等待貼上 YouTube 網址</div><section id="info" class="hidden video"><img id="thumbnail"><div><i>解析完成</i><h2 id="title"></h2><p id="meta"></p></div></section><section id="output" class="hidden"><h2>② 選擇輸出格式</h2><div class="tabs"><button data-type="video" class="active">影片 MP4</button><button data-type="audio">音訊來源</button></div><label id="qualityLabel">影片解析度</label><select id="quality"></select><p id="note"></p><button id="download" class="primary">下載 MP4 ↓</button></section><section><details><summary>檢視執行紀錄</summary><pre id="log">尚未執行。</pre></details></section><footer>請只下載你有權保存的內容</footer></main><script src="app.js"></script></body></html>
